<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta name="color-scheme" content="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Excel Export</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --xl-green:#217346; --xl-green-dk:#185c37; --chrome:#f3f3f3; --chrome-line:#d6d6d6; --ui-text:#262626; --ui-muted:#616161;
  --head-bg:#f0f0f0; --head-line:#d4d4d4; --grid:#e1e1e1; --sel-head:#d3f0e0;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%;background:#fff}
body{font-family:'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif;color:var(--ui-text);font-size:12px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:default}
.xl{display:flex;flex-direction:column;height:100vh}

/* Title bar */
.tb{display:flex;align-items:center;height:32px;padding:0 0 0 10px;background:var(--xl-green);color:#fff;font-size:12px;flex-shrink:0}
.tb .app{display:flex;align-items:center;justify-content:center;width:18px;height:18px;margin-right:12px;border-radius:2px;background:#fff;color:var(--xl-green);font:700 11px/1 'Segoe UI',Arial,sans-serif}
.tb .qa{display:flex;align-items:center;gap:14px;opacity:.95}
.tb .qa svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tb .auto{display:flex;align-items:center;gap:6px}
.tb .tog{width:26px;height:12px;border:1px solid #fff;border-radius:6px;position:relative}
.tb .tog::after{content:"";position:absolute;left:2px;top:2px;width:6px;height:6px;border-radius:50%;background:#fff}
.tb .name{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 16px}
.tb .proto{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px dashed rgba(255,255,255,.7);border-radius:999px;padding:1px 8px;margin-right:8px}
.tb .seg{display:inline-flex;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:2px;margin-right:12px}
.tb .seg button{font-size:11px;font-weight:600;padding:1px 10px;border-radius:999px;color:#e7f3ec;cursor:pointer}
.tb .seg button[aria-pressed="true"]{background:#fff;color:var(--xl-green)}
.tb .win{display:flex;height:100%}
.tb .win span{display:flex;align-items:center;justify-content:center;width:46px;height:100%}
.tb .win svg{width:10px;height:10px;fill:none;stroke:#fff;stroke-width:1}
.embed .tb .proto,.embed .tb .seg{display:none}

/* Ribbon */
.rt{display:flex;align-items:flex-end;gap:2px;height:30px;padding:0 6px;background:var(--xl-green);flex-shrink:0}
.rt span{padding:5px 11px 6px;color:#fff;font-size:12px}
.rt span.on{background:#fff;color:var(--xl-green);border-radius:2px 2px 0 0;font-weight:600}
.rb{display:flex;align-items:center;gap:6px;height:44px;padding:0 10px;background:#fff;border-bottom:1px solid var(--chrome-line);flex-shrink:0;white-space:nowrap;overflow:hidden}
.rb .g{display:flex;align-items:center;gap:4px;padding:0 10px;border-right:1px solid #e3e3e3;height:30px}
.rb .g:last-child{border-right:0}
.rb .dd{display:flex;align-items:center;justify-content:space-between;gap:6px;height:22px;padding:0 6px;border:1px solid #c8c8c8;background:#fff;font-size:12px}
.rb .dd::after{content:"";width:5px;height:5px;border-right:1px solid #666;border-bottom:1px solid #666;transform:rotate(45deg) translateY(-2px)}
.rb .ib{display:flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 4px;font-size:12px;color:#333}
.rb .ib b{font-weight:700} .rb .ib i{font-style:italic;font-family:Georgia,serif} .rb .ib u{text-decoration:underline}
.rb svg{width:16px;height:16px;fill:none;stroke:#444;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.rb .paste{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:0 4px}
.rb .paste svg{width:20px;height:20px;stroke:var(--xl-green)}

/* Formula bar */
.fx{display:flex;align-items:center;height:28px;border-bottom:1px solid var(--chrome-line);background:#fff;flex-shrink:0}
.fx .nb{display:flex;align-items:center;justify-content:space-between;width:96px;height:22px;margin:0 6px;padding:0 6px;border:1px solid #c8c8c8;font-size:12px}
.fx .nb::after{content:"";width:5px;height:5px;border-right:1px solid #666;border-bottom:1px solid #666;transform:rotate(45deg) translateY(-2px)}
.fx .ops{display:flex;align-items:center;gap:12px;padding:0 10px;border-left:1px solid #e3e3e3;border-right:1px solid #e3e3e3;height:100%;color:#888;font-size:13px}
.fx .ops em{font-family:Georgia,'Times New Roman',serif;font-style:italic;color:#444}
.fx .val{flex:1;padding:0 8px;font-family:Calibri,Carlito,Arial,sans-serif;font-size:14px;white-space:nowrap;overflow:hidden}

/* Grid */
.gw{position:relative;flex:1;min-height:0;overflow:auto;background:#fff}
.zoom{zoom:.8;width:max-content}
table.g{border-collapse:collapse;table-layout:fixed;font-family:Calibri,Carlito,'Segoe UI',Arial,sans-serif;color:#333}
table.g td{border:1px solid var(--grid);padding:0 3px;font-size:14.67px;line-height:1.2;white-space:nowrap;overflow:hidden;vertical-align:bottom}
table.g td.ch,table.g td.rh{background:var(--head-bg);border-color:var(--head-line);color:var(--ui-muted);font-family:'Segoe UI',system-ui,Arial,sans-serif;font-size:12px;text-align:center;vertical-align:middle}
table.g td.ch{height:22px;position:sticky;top:0;z-index:2}
table.g td.rh{position:sticky;left:0;z-index:1;width:40px}
table.g td.corner{background:var(--head-bg);border-color:var(--head-line);position:sticky;top:0;left:0;z-index:3}
table.g td.ch.sel,table.g td.rh.sel{background:var(--sel-head);color:var(--xl-green-dk);font-weight:600}
table.g td.ch.sel{box-shadow:inset 0 -2px 0 var(--xl-green)}
table.g td.rh.sel{box-shadow:inset -2px 0 0 var(--xl-green)}
table.g td.wrap{white-space:pre-line}
table.g td.pre{white-space:pre}
table.g td.mid{vertical-align:middle}
table.g td.c{text-align:center} table.g td.r{text-align:right}
table.g td.ovf{overflow:visible;border-right-color:transparent}
.selbox{position:relative;outline:2px solid var(--xl-green);outline-offset:-2px}
.selbox::after{content:"";position:absolute;right:-4px;bottom:-4px;width:6px;height:6px;background:var(--xl-green);border:1px solid #fff}
.frozen td{border-bottom:1px solid #8a8a8a !important}
a.hl{color:#0563C1;text-decoration:underline}

/* Sheet tabs + status bar */
.st{display:flex;align-items:center;height:30px;background:var(--chrome);border-top:1px solid var(--chrome-line);flex-shrink:0}
.st .nav{display:flex;gap:10px;padding:0 12px;color:#9a9a9a}
.st .nav svg{width:10px;height:10px;fill:currentColor}
.st .tab{align-self:stretch;display:flex;align-items:center;padding:0 18px;background:#fff;color:var(--xl-green);font-weight:600;border-left:1px solid var(--chrome-line);border-right:1px solid var(--chrome-line);box-shadow:inset 0 -2px 0 var(--xl-green)}
.st .add{display:flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:8px;border-radius:50%;color:#666;font-size:16px;line-height:1}
.sb{display:flex;align-items:center;gap:16px;height:24px;padding:0 12px;background:var(--chrome);border-top:1px solid #e3e3e3;color:#444;font-size:11.5px;flex-shrink:0}
.sb .sp{flex:1}
.sb .views{display:flex;gap:10px}
.sb .views i{display:block;width:13px;height:11px;border:1px solid #777}
.sb .views i.on{background:#cfd8d2;border-color:var(--xl-green)}
.sb .zm{display:flex;align-items:center;gap:8px}
.sb .bar{position:relative;width:100px;height:1px;background:#888}
.sb .bar::before{content:"";position:absolute;left:50%;top:-4px;width:1px;height:9px;background:#888}
.sb .bar b{position:absolute;left:40%;top:-5px;width:4px;height:11px;background:#444}
</style>
</head>
<body>
<script>try { if (window.self !== window.top) document.documentElement.classList.add('embed'); } catch (e) { document.documentElement.classList.add('embed'); }</script>
<div class="xl">
  <div class="tb">
    <span class="app">X</span>
    <div class="qa">
      <span class="auto">AutoSave <span class="tog"></span></span>
      <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="1"/><rect x="5" y="2" width="6" height="4"/><rect x="4.5" y="9" width="7" height="5"/></svg>
      <svg viewBox="0 0 16 16"><path d="M4 6h6a3 3 0 0 1 0 6H7"/><polyline points="6 3 3 6 6 9"/></svg>
      <svg viewBox="0 0 16 16"><path d="M12 6H6a3 3 0 0 0 0 6h3"/><polyline points="10 3 13 6 10 9"/></svg>
    </div>
    <div class="name" id="fileName"></div>
    <span class="proto">Prototype</span>
    <div class="seg" id="seg">
      <button type="button" data-mode="today" aria-pressed="false">Today</button>
      <button type="button" data-mode="after" aria-pressed="true">After change</button>
    </div>
    <div class="win">
      <span><svg viewBox="0 0 10 10"><line x1="0" y1="5" x2="10" y2="5"/></svg></span>
      <span><svg viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg></span>
      <span><svg viewBox="0 0 10 10"><line x1="0" y1="0" x2="10" y2="10"/><line x1="10" y1="0" x2="0" y2="10"/></svg></span>
    </div>
  </div>
  <div class="rt"><span>File</span><span class="on">Home</span><span>Insert</span><span>Page Layout</span><span>Formulas</span><span>Data</span><span>Review</span><span>View</span><span>Help</span></div>
  <div class="rb">
    <div class="g"><span class="paste"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="12" height="15" rx="1"/><rect x="7" y="1.5" width="6" height="3" rx="1"/></svg>Paste</span></div>
    <div class="g"><span class="dd" style="width:110px">Calibri</span><span class="dd" style="width:44px">11</span><span class="ib"><b>B</b></span><span class="ib"><i>I</i></span><span class="ib"><u>U</u></span></div>
    <div class="g">
      <span class="ib"><svg viewBox="0 0 16 16"><line x1="2" y1="4" x2="14" y2="4"/><line x1="2" y1="8" x2="10" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></span>
      <span class="ib"><svg viewBox="0 0 16 16"><line x1="2" y1="4" x2="14" y2="4"/><line x1="4" y1="8" x2="12" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></span>
      <span class="ib"><svg viewBox="0 0 16 16"><line x1="2" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="2" y1="12" x2="14" y2="12"/></svg></span>
      <span class="ib">Wrap Text</span><span class="ib">Merge &amp; Center</span>
    </div>
    <div class="g"><span class="dd" style="width:96px">General</span><span class="ib">%</span><span class="ib">,</span></div>
    <div class="g"><span class="ib">Conditional Formatting</span><span class="ib">Format as Table</span><span class="ib">Cell Styles</span></div>
    <div class="g"><span class="ib">Insert</span><span class="ib">Delete</span><span class="ib">Format</span></div>
    <div class="g"><span class="ib">Σ</span><span class="ib">Sort &amp; Filter</span><span class="ib">Find &amp; Select</span></div>
  </div>
  <div class="fx"><span class="nb">A1</span><span class="ops"><span>✕</span><span>✓</span><em>fx</em></span><span class="val">Analytics &amp; Reports</span></div>
  <div class="gw" id="gw"><div class="zoom"><table class="g" id="grid"></table></div></div>
  <div class="st">
    <span class="nav"><svg viewBox="0 0 10 10"><polygon points="7 1 2 5 7 9"/></svg><svg viewBox="0 0 10 10"><polygon points="3 1 8 5 3 9"/></svg></span>
    <span class="tab">Report</span>
    <span class="add">+</span>
  </div>
  <div class="sb"><span>Ready</span><span class="sp"></span><span class="views"><i class="on"></i><i></i><i></i></span>
    <span class="zm"><span>−</span><span class="bar"><b></b></span><span>+</span><span>80%</span></span></div>
</div>

<script src="shared.js?v=20261023d"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mode = MO.modeFromUrl(), after = mode === 'after';
  const PX = (w) => Math.round(w * 7 + 5);             // Excel column width (characters) to pixels at 100%
  const PT = (h) => Math.round((h * 4) / 3);            // row height (points) to pixels

  // Column keys the "Report (Excel Sheet)" export gets with "Only Report" (downloadRequest.js drops the image columns)
  // and widths from excel.service.ts COL_WIDTHS; Module Outputs is the new column.
  const COLS = [
    ['sno', 'S. No.', 8], ['timestamp', 'Timestamp', 24], ['overallResult', 'Overall Result', 16], ['variant', 'Variant', 22],
    ['resultsJson', 'Results JSON', 40], ['cameraPosition', 'Camera Position', 20], ['cameraConfig', 'Camera Configuration', 24],
    ['configResult', 'Config Result', 16], ['moduleOutputs', 'Module Outputs', 36],
  ].filter((c) => after || c[0] !== 'moduleOutputs');
  const PER_RESULT = new Set(['sno', 'timestamp', 'overallResult', 'variant', 'resultsJson']);
  const LAST_COL = 16; // A..P drawn
  const letter = (n) => String.fromCharCode(64 + n);

  $('fileName').textContent = 'Line_1_Instance_Variant_A__Variant_B_20-10-2026_20-10-2026.xlsx';
  document.querySelectorAll('#seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === mode)));
  $('seg').addEventListener('click', (e) => {
    const b = e.target.closest('button[data-mode]');
    if (b && b.dataset.mode !== mode) location.replace('?mode=' + b.dataset.mode);
  });

  function build() {
    const setup = MO.resolveSetup(true).setup;
    const n = COLS.length;
    const cells = {};      // "r,c" -> { html, cls, style, rs, cs }
    const covered = new Set();
    const rowH = {};
    const put = (r, c, html, o = {}) => {
      cells[r + ',' + c] = Object.assign({ html }, o);
      for (let i = 0; i < (o.rs || 1); i++) for (let j = 0; j < (o.cs || 1); j++) if (i || j) covered.add((r + i) + ',' + (c + j));
    };
    // 1. Title
    put(1, 1, 'Analytics &amp; Reports', { cs: n, style: 'font-weight:700;font-size:24px;color:#333', cls: 'mid selbox' }); rowH[1] = PT(30);
    // 2. Metadata
    [['Instance', 'Line 1 Instance'], ['Variant', 'Variant A, Variant B'],
      ['Date Range', '20/10/2026, 12:00:00 am  →  20/10/2026, 11:59:59 pm'], ['Generated', '20/10/2026, 2:20:31 pm']].forEach(([k, v], i) => {
      put(2 + i, 1, k, { cs: 2, style: 'font-weight:700;color:#555', cls: 'mid' });
      put(2 + i, 3, esc(v), { cs: n - 2, style: 'color:#333', cls: 'mid pre' });
    });
    // 3. Summary bar (row 7)
    let col = 1;
    [['Total', 3, '#333333', '#F8F9FA'], ['Pass', 2, '#28A745', '#E8F5E9'], ['Fail', 1, '#DC3545', '#FDECEA'], ['User Feedback', 0, '#6C757D', '#F8F9FA']]
      .forEach(([label, value, color, bg]) => {
        const lc = label === 'User Feedback' ? 2 : 1, bd = 'border-color:#D0D0D0';
        put(7, col, label, { cs: lc, style: `font-weight:700;font-size:16px;color:${color};background:${bg};${bd}`, cls: 'mid r' });
        put(7, col + lc, String(value), { cs: 2, style: `font-weight:700;font-size:18.67px;color:${color};background:${bg};${bd}`, cls: 'mid r' });
        col += lc + 2;
      });
    rowH[7] = PT(28);
    // 4. Header row (row 9)
    COLS.forEach(([, label], i) => put(9, i + 1, label, { style: 'font-weight:700;color:#fff;background:#DC3545;border-color:#BA2D3B', cls: 'mid c' }));
    rowH[9] = PT(24);
    // 5. Data rows, per-result columns merged across the cycle's capture rows
    let r = 10;
    MO.CYCLES.forEach((c, ci) => {
      const bg = (ci + 1) % 2 === 0 ? '#F8F9FA' : '#FFFFFF', rows = c.caps.length;
      c.caps.forEach((cap, di) => {
        const last = di === rows - 1, base = `background:${bg};border-color:#D0D0D0;${last ? 'border-bottom-color:#B0B0B0;' : ''}`;
        let lines = 1;
        COLS.forEach(([key], i) => {
          if (PER_RESULT.has(key) && di > 0) return;
          const o = { style: base + 'font-size:13.33px;', cls: 'mid' };
          if (PER_RESULT.has(key)) { o.rs = rows; o.style += 'border-bottom-color:#B0B0B0;'; }
          let v = '';
          switch (key) {
            case 'sno': v = String(ci + 1); o.cls += ' c'; break;
            case 'timestamp': v = c.ts; break;
            case 'overallResult': case 'configResult': {
              const ok = key === 'overallResult' ? c.result : cap.result;
              v = ok ? 'PASS' : 'FAIL'; o.cls += ' c'; o.style += `font-weight:700;color:${ok ? '#28A745' : '#DC3545'};`; break;
            }
            case 'variant': v = c.variant; break;
            case 'resultsJson': v = '<a class="hl">View JSON</a>'; o.cls += ' c'; break;
            case 'cameraPosition': v = cap.pos; break;
            case 'cameraConfig': v = cap.name; break;
            case 'moduleOutputs': {
              const ls = MO.outputLines(c, cap, setup).map((l) => `${l.name}: ${l.value}`);
              v = ls.length ? esc(ls.join('\n')) : 'N/A'; o.cls += ' wrap'; lines = Math.max(lines, ls.length || 1); break;
            }
          }
          put(r, i + 1, v, o);
        });
        rowH[r] = lines > 1 ? Math.round(lines * 17.5 + 2) : PT(15);
        r++;
      });
    });
    const dataEnd = r - 1;
    // 7. Footer
    r += 1;
    put(r, 1, `Total Records: ${MO.CYCLES.length}`, { cs: 3, style: 'font-weight:700;font-style:italic;font-size:13.33px;color:#888', cls: 'ovf' });
    const footer = r;

    // Render: column headers, row numbers, gridlines
    const widths = [40].concat(Array.from({ length: LAST_COL }, (_, i) => (COLS[i] ? PX(COLS[i][2]) : 64)));
    let html = '<colgroup>' + widths.map((w) => `<col style="width:${w}px">`).join('') + '</colgroup>';
    html += '<tr><td class="corner"></td>' + Array.from({ length: LAST_COL }, (_, i) => `<td class="ch${i < n ? ' sel' : ''}">${letter(i + 1)}</td>`).join('') + '</tr>';
    const lastRow = Math.max(footer + 30, 50);
    for (let row = 1; row <= lastRow; row++) {
      html += `<tr${row === 9 ? ' class="frozen"' : ''} style="height:${rowH[row] || PT(15)}px"><td class="rh${row === 1 ? ' sel' : ''}">${row}</td>`;
      for (let cc = 1; cc <= LAST_COL; cc++) {
        const k = row + ',' + cc;
        if (covered.has(k)) continue;
        const x = cells[k];
        if (!x) { html += '<td></td>'; continue; }
        html += `<td${x.rs > 1 ? ` rowspan="${x.rs}"` : ''}${x.cs > 1 ? ` colspan="${x.cs}"` : ''}${x.cls ? ` class="${x.cls}"` : ''}${x.style ? ` style="${x.style}"` : ''}>${x.html}</td>`;
      }
      html += '</tr>';
    }
    $('grid').innerHTML = html;
    return dataEnd;
  }
  build();
  window.addEventListener('storage', (e) => { if (e.key === null || e.key === MO.KEY) build(); });
})();
</script>
</body>
</html>
